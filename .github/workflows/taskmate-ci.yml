# Generado por TaskMate (GitHub → CI/CD). Cámbialo desde TaskMate: si lo editas a mano,
# TaskMate lo reemplaza la próxima vez que alguien configure el pipeline.
# taskmate-pipeline: 1
name: 'TaskMate CI/CD'
run-name: ${{ inputs.environment && inputs.environment != 'none' && format('Deploy a {0} desde TaskMate', inputs.environment) || '' }}

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno a desplegar (none = solo CI)'
        type: choice
        options: ['none', 'staging', 'production']
        default: 'none'
      version:
        description: 'Commit a desplegar (SHA completo)'
        type: string
        default: ''
      requested_by:
        description: 'Usuario de TaskMate que pidió el deploy'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  ci:
    name: 'CI (Node.js)'
    if: github.event_name != 'workflow_dispatch' || inputs.environment == 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: taskmate-ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 'Node.js 24'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 'package-lock.json'
      - name: 'Instalar dependencias'
        run: npm ci
      - name: 'Análisis estático'
        run: npm run lint
      - name: 'Pruebas'
        run: npm test
      - name: 'Build'
        run: npm run build

  deploy:
    name: 'Deploy a GitHub Pages'
    needs: ci
    if: >-
      always() && github.ref_name == github.event.repository.default_branch && (
        (github.event_name == 'push' && needs.ci.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment != 'none')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      deployments: write
      id-token: write
      pages: write
    concurrency:
      group: taskmate-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 'Versiones a publicar'
        id: versions
        uses: actions/github-script@v9
        with:
          script: |
            const SHA = /^[0-9a-f]{40}$/;
            const target = process.env.TARGET_ENV;
            const version = process.env.TARGET_VERSION;
            const requestedBy = String(process.env.REQUESTED_BY || '').replace(/[^A-Za-z0-9_.@ -]/g, '').slice(0, 60);
            if (!['staging', 'production'].includes(target)) throw new Error('Entorno inválido: ' + target);
            if (!SHA.test(version)) throw new Error('Versión inválida (se espera el SHA completo del commit): ' + version);
            const { owner, repo } = context.repo;
            const live = async (environment) => {
              const { data } = await github.rest.repos.listDeployments({ owner, repo, environment, task: 'deploy:taskmate', per_page: 30 });
              for (const deployment of data) {
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({ owner, repo, deployment_id: deployment.id, per_page: 1 });
                if (statuses.length > 0 && statuses[0].state === 'success') return deployment.sha;
              }
              return '';
            };
            const other = target === 'staging' ? 'production' : 'staging';
            const versions = { [target]: version, [other]: await live(other) };
            const logUrl = context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId;
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner, repo, ref: version, task: 'deploy:taskmate', environment: target,
              auto_merge: false, required_contexts: [], production_environment: target === 'production', transient_environment: false,
              description: requestedBy ? 'Desde TaskMate, pedido por ' + requestedBy : 'Desde TaskMate',
              payload: { taskmate: true, requestedBy, runId: context.runId },
            });
            await github.rest.repos.createDeploymentStatus({ owner, repo, deployment_id: deployment.id, state: 'in_progress', log_url: logUrl });
            core.setOutput('production', versions.production);
            core.setOutput('staging', versions.staging);
            core.setOutput('deployment_id', String(deployment.id));
        env:
          TARGET_ENV: ${{ github.event_name == 'push' && 'staging' || inputs.environment }}
          TARGET_VERSION: ${{ github.event_name == 'push' && github.sha || inputs.version }}
          REQUESTED_BY: ${{ inputs.requested_by }}
      - name: 'Configurar GitHub Pages'
        id: pages
        uses: actions/configure-pages@v6
      - name: 'Node.js 24'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 'Checkout de producción'
        if: steps.versions.outputs.production != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.versions.outputs.production }}
          path: '_taskmate/production'
          persist-credentials: false
      - name: 'Build de producción'
        if: steps.versions.outputs.production != ''
        working-directory: '_taskmate/production'
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm ci
          npm run build -- --base="$BASE_PATH"
      - name: 'Checkout de staging'
        if: steps.versions.outputs.staging != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.versions.outputs.staging }}
          path: '_taskmate/staging'
          persist-credentials: false
      - name: 'Build de staging'
        if: steps.versions.outputs.staging != ''
        working-directory: '_taskmate/staging'
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/staging/
        run: |
          npm ci
          npm run build -- --base="$BASE_PATH"
      - name: 'Armar el sitio (producción en /, staging en /staging/)'
        env:
          PRODUCTION: ${{ steps.versions.outputs.production }}
          STAGING: ${{ steps.versions.outputs.staging }}
        run: |
          set -euo pipefail
          copy_site() {
            if [ ! -d "$1" ]; then echo "::error::No se encontró la carpeta del sitio: $1"; exit 1; fi
            mkdir -p "$2"
            tar --exclude=./.git --exclude=./.github -C "$1" -cf - . | tar -C "$2" -xf -
          }
          mkdir -p _site
          if [ -n "$PRODUCTION" ]; then
            copy_site '_taskmate/production/dist' _site
          else
            printf '%s\n' '<!doctype html>' '<html lang="es"><head><meta charset="utf-8"><title>Sin versión en producción</title></head>' '<body><p>Producción todavía no tiene una versión publicada desde TaskMate.</p>' '<p><a href="staging/">Ver staging</a></p></body></html>' > _site/index.html
          fi
          rm -rf _site/staging
          if [ -n "$STAGING" ]; then
            copy_site '_taskmate/staging/dist' _site/staging
          fi
      - name: 'Subir el sitio'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: 'Publicar en GitHub Pages'
        id: publish
        uses: actions/deploy-pages@v5
      - name: 'Registrar el deploy'
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const base = String(process.env.PAGE_URL || '').replace(/\/?$/, '/');
            const url = process.env.TARGET_ENV === 'staging' ? base + 'staging/' : base;
            const logUrl = context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId;
            await github.rest.repos.createDeploymentStatus({
              owner, repo, deployment_id: Number(process.env.DEPLOYMENT_ID), state: 'success',
              environment_url: url, log_url: logUrl, auto_inactive: true,
            });
        env:
          DEPLOYMENT_ID: ${{ steps.versions.outputs.deployment_id }}
          TARGET_ENV: ${{ github.event_name == 'push' && 'staging' || inputs.environment }}
          PAGE_URL: ${{ steps.publish.outputs.page_url }}
      - name: 'Registrar el deploy fallido'
        if: (failure() || cancelled()) && steps.versions.outputs.deployment_id != ''
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const logUrl = context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId;
            await github.rest.repos.createDeploymentStatus({
              owner, repo, deployment_id: Number(process.env.DEPLOYMENT_ID), state: 'failure', log_url: logUrl,
            });
        env:
          DEPLOYMENT_ID: ${{ steps.versions.outputs.deployment_id }}
